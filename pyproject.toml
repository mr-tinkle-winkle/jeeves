[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jeeves"
version = "0.1.0"
description = "Local-first voice assistant for Linux (NixOS): agents, wake words, composable functions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
input = ["evdev"]
wake = ["vosk"]
wikipedia = ["libzim"]
kokoro = ["kokoro-onnx"]
test = ["pytest"]

[project.scripts]
jeeves = "jeeves.cli:main"

[tool.setuptools.packages.find]
include = ["jeeves*"]

[tool.setuptools.package-data]
"jeeves.gui.ui_kit.resources" = ["*.png"]
"jeeves.resources" = ["icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
